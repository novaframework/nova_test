name: Build and test

on: [push, pull_request]

jobs:
  ci:
    uses: Taure/erlang-ci/.github/workflows/ci.yml@v1
    with:
      otp-version: '28.5'
      rebar3-version: '3.26.0'
      enable-ct: true
      enable-ex-doc: true
      enable-dialyzer: true
      enable-audit: true
      enable-sbom: true
      enable-sbom-scan: true
      enable-dependency-submission: true
      enable-summary: true

  release:
    needs: ci
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: Taure/erlang-ci/.github/workflows/release.yml@v2.3.2
    permissions:
      contents: write

  hex-publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: Taure/erlang-ci/.github/workflows/hex-publish.yml@v2.3.2
    permissions:
      contents: read
      id-token: write
    with:
      tag: ${{ needs.release.outputs.tag }}
      otp-version: '28.5'
      rebar3-version: '3.28.0'
