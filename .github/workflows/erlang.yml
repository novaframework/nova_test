name: Build and test

on: [push, pull_request]

jobs:
  ci:
    uses: Taure/erlang-ci/.github/workflows/ci.yml@v1
    with:
      otp-version: '28.5'
      rebar3-version: '3.26.0'
      enable-ct: true
      enable-ex-doc: true
      enable-dialyzer: true
      enable-audit: true
      enable-sbom: true
      enable-sbom-scan: true
      enable-dependency-submission: true
      enable-summary: true
